        <ellipse data-peek-pupil="" id="left-pupil" fill="#000000" cx="452" cy="544" rx="8" ry="10"/>
      </g>
      <g data-peek-eye="" transform="rotate(5 524 542)">
        <ellipse data-peek-white="" id="right-eye-white" fill="#FFFFFF" cx="524" cy="542" rx="21" ry="22"/>
        <ellipse data-peek-pupil="" id="right-pupil" fill="#000000" cx="516" cy="544" rx="8" ry="10"/>
      </g>
    </g>
    <path d="M268 569 L738 577"/>
  </g>
