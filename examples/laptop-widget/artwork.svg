    <path fill="#FFFFFF" d="M252 204 Q248 187 271 185 L775 197 Q795 198 795 220 L772 627 L235 618 Z"/>
    <path fill="#FFFFFF" d="M281 233 Q280 226 292 227 L751 238 Q758 238 757 252 L738 577 L268 569 Z"/>
