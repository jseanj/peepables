<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" stroke="#000000" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
  <title>Peeking Eyes Doodle — laptop</title>
