      <path d="M342 657 L326 719 M412 658 L403 722 M483 659 L480 723 M554 660 L558 724 M625 662 L636 725 M693 663 L713 726"/>
    </g>
    <path id="trackpad" stroke-width="10" d="M437 747 Q486 745 572 749 L586 775 L422 772 Z"/>
